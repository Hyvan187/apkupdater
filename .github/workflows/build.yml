name: APKUpdater Glass
on:
  push:
    branches: ['glass/**']
  pull_request:
    branches: ['3.x']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: glass-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android 17 SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests, lint and debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Name and verify artifact
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/APKUpdater-Glass-Debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs artifacts/APKUpdater-Glass-Debug.apk > artifacts/signature.txt
          git rev-parse HEAD > artifacts/commit.txt
          cd artifacts
          sha256sum APKUpdater-Glass-Debug.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: APKUpdater-Glass-Debug
          path: |
            artifacts/
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
  android17-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: actions/download-artifact@v4
        with:
          name: APKUpdater-Glass-Debug
          path: received
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and start Android 17 emulator
        run: |
          sdkmanager 'emulator' 'system-images;android-37.0;default;x86_64'
          echo no | avdmanager create avd --force --name glass17 --package 'system-images;android-37.0;default;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd glass17 -no-window -no-audio -no-snapshot -gpu swiftshader_indirect > emulator.log 2>&1 &
          timeout 240 adb wait-for-device
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'
          adb install received/artifacts/APKUpdater-Glass-Debug.apk
          adb shell am start -W -n com.hyvan187.apkupdater/com.apkupdater.ui.activity.MainActivity
          sleep 15
          adb shell pidof com.hyvan187.apkupdater
          adb logcat -d > logcat.txt
          adb shell screencap -p /sdcard/glass.png
          adb pull /sdcard/glass.png screenshot.png
          ! grep -A 5 'FATAL EXCEPTION' logcat.txt | grep 'com.hyvan187.apkupdater'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android17-Smoke-Evidence
          path: |
            logcat.txt
            emulator.log
            screenshot.png
