name: UniAPK
on:
  push:
    branches: ['glass/**']
  pull_request:
    branches: ['3.x']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: glass-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android 17 SDK
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools'
          python3 tools/normalize-sdk37.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Download verified Gradle with network retries
        run: |
          gradle_zip="$RUNNER_TEMP/uniapk-gradle.zip"
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 \
            https://downloads.gradle.org/distributions/gradle-9.4.0-bin.zip -o "$gradle_zip" || \
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 \
            https://github.com/gradle/gradle-distributions/releases/download/v9.4.0/gradle-9.4.0-bin.zip -o "$gradle_zip"
          printf '%s  %s\n' '60ea723356d81263e8002fec0fcf9e2b0eee0c0850c7a3d7ab0a63f2ccc601f3' "$gradle_zip" | sha256sum --check
          unzip -q "$gradle_zip" -d "$RUNNER_TEMP/uniapk-gradle"
          echo "$RUNNER_TEMP/uniapk-gradle/gradle-9.4.0/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies with network retries
        run: |
          cat > "$RUNNER_TEMP/uniapk-prefetch.gradle" <<'GROOVY'
          allprojects { project ->
              afterEvaluate {
                  if (project.path == ':app') {
                      tasks.register('prefetchCiDependencies') {
                          doLast {
                              project.configurations.findAll { configuration ->
                                  configuration.canBeResolved &&
                                      (configuration.name.endsWith('CompileClasspath') ||
                                       configuration.name.endsWith('RuntimeClasspath') ||
                                       configuration.name == 'kotlinBuildToolsApiClasspath')
                              }.each { configuration -> configuration.resolve() }
                          }
                      }
                  }
              }
          }
          GROOVY
          resolved=0
          for attempt in 1 2 3; do
            if gradle -I "$RUNNER_TEMP/uniapk-prefetch.gradle" :app:prefetchCiDependencies --stacktrace; then
              resolved=1
              break
            fi
          done
          test "$resolved" = 1
      - name: Tests, lint and debug APK
        run: |
          gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Name and verify artifact
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-universal-debug.apk artifacts/UniAPK-Debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs artifacts/UniAPK-Debug.apk > artifacts/signature.txt
          git rev-parse HEAD > artifacts/commit.txt
          cd artifacts
          sha256sum UniAPK-Debug.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UniAPK-Debug
          path: |
            artifacts/
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
  android17-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v4
        with:
          name: UniAPK-Debug
          path: received
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and start Android 17 emulator
        run: |
          sdkmanager 'emulator' 'system-images;android-37.0;default;x86_64'
          echo no | avdmanager create avd --force --name glass17 --package 'system-images;android-37.0;default;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd glass17 -no-window -no-audio -no-snapshot -gpu swiftshader_indirect > emulator.log 2>&1 &
          timeout 240 adb wait-for-device
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'
          adb install received/artifacts/UniAPK-Debug.apk
          adb shell am start -W -n org.uniapk.upgrader/org.uniapk.upgrader.ui.activity.MainActivity
          sleep 15
          adb shell pidof org.uniapk.upgrader
          adb logcat -d > logcat.txt
          adb shell screencap -p /sdcard/glass.png
          adb pull /sdcard/glass.png screenshot.png
          ! grep -A 5 'FATAL EXCEPTION' logcat.txt | grep 'org.uniapk.upgrader'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android17-Smoke-Evidence
          path: |
            logcat.txt
            emulator.log
            screenshot.png
